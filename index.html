/* Цвета берутся из темы Telegram (--tg-theme-*), запасные — для обычного браузера */
:root{
  --bg: var(--tg-theme-bg-color, #ffffff);
  --bg2: var(--tg-theme-secondary-bg-color, #f1f4f6);
  --text: var(--tg-theme-text-color, #14212b);
  --hint: var(--tg-theme-hint-color, #56636d);
  --link: var(--tg-theme-link-color, #0e6b73);

  --red: #b03024; --red-bg: rgba(192,57,43,.12);

  --green: #1d6b41; --green-bg: rgba(46,139,87,.14);
  --line: rgba(127,140,150,.24);
}
/* Тёмная тема Telegram: смысловые цвета светлее, чтобы читались на тёмном фоне */
:root[data-theme="dark"]{ --red:#ff8a7a; --red-bg:rgba(255,110,90,.16); --amber:#f2c35b; --amber-bg:rgba(242,195,91,.15);

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:left}

// Условные данные. В пилоте всё это приходит из реестра МФО.
function monthly(firstIso, n){
  const [y,m,d] = firstIso.split('-').map(Number), out = [];
  for (let i=0;i<n;i++){
    const yy = y + Math.floor((m-1+i)/12), mm = (m-1+i)%12;
    const last = new Date(Date.UTC(yy, mm+1, 0)).getUTCDate();
    out.push(`${yy}-${String(mm+1).padStart(2,'0')}-${String(Math.min(d,last)).padStart(2,'0')}`);
  }
  return out;
}

    closed:'Займ полностью погашен!', demoConfirmed:'Демо: платёж подтверждён условно.', ready:'Готово'
  }
};
function plural(n,a,b,c){ const m10=n%10, m100=n%100; return m10===1&&m100!==11?a:(m10>=2&&m10<=4&&(m100<10||m100>=20)?b:c); }

/* ===================== СОСТОЯНИЕ ===================== */
// Память на телефоне (в пилоте — на сервере ДКБ)
function load(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } }
function save(k, v){ try{ v === null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
const params = new URLSearchParams(location.search);
let tg = null, inTelegram = false;
const TODAY = params.get('today') || DEMO_TODAY;
const CONFIRM_MS = Number(params.get('confirm_ms') || DEMO_CONFIRM_MS);
const SET = params.get('set') || 'main';
let LOANS = (DEMO_SETS[SET] || DEMO_SETS.main)();
const savedLang = load('langPref', null), urlLt = Number(params.get('lt') || 0);
let lang = savedLang && savedLang.ts > urlLt ? savedLang.lang : (params.get('lang') === 'ru' ? 'ru' : 'ky');
// Язык по умолчанию — кыргызский. Язык Telegram не берём: официального кыргызского в Telegram нет, почти у всех он на русском.
const PAY_KEY = `payments:${SET}:${TODAY}`, PENDING_KEY = `pending:${SET}:${TODAY}`, AUTH_KEY = 'auth';
let slowTimer = null, confirmTimer = null, navAt = 0, hiddenAt = 0;
let stack = [], view = { name:'home' }, showAll = false;
let pay = null;          // { loanId, amount, editing, msg, bank }
let lastPayment = null;  // последняя подтверждённая оплата
let entry = null;        // куда вести после входа (из напоминания)
let onb = { phone:null, fails:0, msg:null };
window.__ev = [];        // журнал событий (для автотестов)
const ev = (type, data) => window.__ev.push(Object.assign({ type, view: view.name }, data || {}));

const t = () => T[lang];
const fmt = n => Math.round(n).toLocaleString('ru-RU').replace(/\s/g,' ');
const money = n => `${fmt(n)} ${t().som}`;
const dn = iso => Date.UTC(+iso.slice(0,4), +iso.slice(5,7)-1, +iso.slice(8,10)) / 864e5;
function date(iso){ const m = MONTHS[lang][+iso.slice(5,7)-1], d = +iso.slice(8,10), y = iso.slice(0,4);
  const base = lang==='ky' ? `${d}-${m}` : `${d} ${m}`;
  if (y === TODAY.slice(0,4)) return base;
  return lang==='ky' ? `${y}-ж. ${base}` : `${base} ${y} г.`; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const maskPhone = p => { const d = String(p).replace(/\D/g,''); return `+${d.slice(0,3)} *** ** ${d.slice(-4,-2)} ${d.slice(-2)}`; };
function haptic(k){ try{ tg && tg.HapticFeedback && (k ? tg.HapticFeedback.notificationOccurred(k) : tg.HapticFeedback.impactOccurred('light')); }catch(e){} }
function toast(msg){ const d=document.createElement('div'); d.className='toast'; d.setAttribute('role','status'); d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
function getLastBank(){ return load('lastBank', 'mbank'); }
const tgSupports = v => !!(tg && inTelegram && tg.isVersionAtLeast && tg.isVersionAtLeast(v));

/* Всё, что видит клиент, считается из графика — одно место правды */
function calc(l){
  const unpaid = l.schedule.slice(l.paid);
  const pastDue = unpaid.filter(d => dn(d) < dn(TODAY));
  const credit = l.credit || 0;
  const dueRaw = pastDue.length ? pastDue.length * l.payment + l.penalty : (unpaid.length ? l.payment : 0);
  const due = Math.max(0, dueRaw - credit);
  const dueDate = pastDue.length ? pastDue[0] : unpaid[0];
  const overdue = pastDue.length ? dn(TODAY) - dn(pastDue[0]) : 0;
  const daysLeft = !pastDue.length && unpaid.length ? dn(unpaid[0]) - dn(TODAY) : null;
  const coversCount = pastDue.length || (unpaid.length ? 1 : 0);
  const after = unpaid[coversCount] || null;
  const totalLeft = Math.max(0, unpaid.length * l.payment + (pastDue.length ? l.penalty : 0) - credit);
  return { unpaid, pastDue, due, dueRaw, dueDate, overdue, daysLeft, after, totalLeft, coversCount, closed: unpaid.length === 0 };
}
const active = () => LOANS.filter(l => !calc(l).closed);
const loanById = id => LOANS.find(l => l.id === id);
function statusPill(c){
  if (c.overdue) return `<span class="pill red">${t().late(c.overdue)}</span>`;
  if (c.daysLeft === 0) return `<span class="pill amber">${t().today}</span>`;
  if (c.daysLeft <= 5) return `<span class="pill amber">${t().left(c.daysLeft)}</span>`;
  return `<span class="pill grey">${t().until(date(c.dueDate))}</span>`;
}
/* Применяем подтверждённую оплату к займу (в пилоте это делает МФО) */
function applyPayment(l, amount){
  let c = calc(l), rest = amount + (l.credit || 0);
  l.credit = 0;
  while (rest > 0 && !c.closed){
    if (rest >= c.dueRaw){ rest -= c.dueRaw; l.paid += c.coversCount; l.penalty = 0; c = calc(l); }
    else { l.credit = rest; rest = 0; }
  }
}

/* ===================== НАВИГАЦИЯ ===================== */
function go(next){ haptic(); stack.push(view); view = next; showAll = false; navAt = Date.now(); render(); window.scrollTo(0,0); }
function back(){
  haptic();
  if (view.name === 'wait') cancelPending(false);   // ушёл с ожидания — платёж не начат
  view = stack.pop() || { name:'home' }; navAt = Date.now(); render(); window.scrollTo(0,0);
}
function setRoot(v){ stack = []; view = v; navAt = Date.now(); render(); window.scrollTo(0,0); }
// Второе касание быстрее 0,3 сек после смены экрана — случайное (дрожит рука, тормозит телефон)
document.addEventListener('click', e => { if (Date.now() - navAt < 300){ e.stopPropagation(); e.preventDefault(); } }, true);

function tgInit(){
  if (tg || !(window.Telegram && window.Telegram.WebApp)) return;
  tg = window.Telegram.WebApp; inTelegram = !!tg.initData;
  try{ tg.ready(); tg.expand(); tg.BackButton.onClick(back); if (tg.colorScheme === 'dark') document.documentElement.dataset.theme = 'dark'; }catch(e){}
  render();
}

const isRoot = () => stack.length === 0;

  const langBtn = isRoot() ? `<button class="lang" onclick="toggleLang()">${t().other}</button>` : '<span></span>';

}
const bottom = html => `<div class="bottom"><div class="in">${html}</div></div>`;

function welcomeScreen(){

// Номер берём у Telegram (человек подтверждает в окне Telegram), в браузере — демо-номер
function sharePhone(){
  ev('share');
  const done = phone => {
    if (!phone){ onb.msg = t().shareDenied; ev('shareDenied'); render(); return; }
    onb.phone = phone; onb.msg = null;
    // Прототип: номер на 0000 — «не найден». В пилоте — поиск в реестре МФО.
    if (String(phone).replace(/\D/g,'').endsWith('0000')){ ev('notFound'); setRoot({ name:'notfound' }); return; }
    setRoot({ name:'birth' });
  };
  if (tgSupports('6.9') && tg.requestContact){
    try{ tg.requestContact((ok, res) => done(ok ? ((res && res.responseUnsafe && res.responseUnsafe.contact && res.responseUnsafe.contact.phone_number) || 'shared') : null)); return; }catch(e){}
  }

}
function notFoundScreen(){
  return `${header()}<h1>${t().nfTitle}</h1>
    <div class="card">${t().nfText(maskPhone(onb.phone || ''))}</div>
    <div class="card call"><span class="hint">${t().ask}</span><a href="tel:${HELP_PHONE.replace(/\s/g,'')}">${HELP_PHONE}</a></div>
    ${bottom(`<button class="main" onclick="closeApp()">${t().close}</button>`)}`;
}
function birthScreen(){
  const f = (id, label, ph, max) => `<label>${label}<input id="${id}" inputmode="numeric" autocomplete="off" maxlength="${max}" placeholder="${ph}"
      oninput="this.value=this.value.replace(/\\D/g,'');if(this.value.length>=${max})nextField('${id}')" onkeydown="if(event.key==='Enter')checkBirth()"></label>`;
  return `${header()}<h1>${t().birthTitle}</h1><p class="sub">${t().birthSub}</p>
    <div class="card"><div class="dob">${f('dd',t().day,'15',2)}${f('mm',t().month,'03',2)}${f('yy',t().year,'1985',4)}</div>
    ${onb.msg ? `<div class="note err" role="status">${onb.msg}</div>` : ''}</div>
    ${bottom(`<button class="main" id="birthBtn" onclick="checkBirth()">${t().next}</button>`)}`;
}
function nextField(id){ const n = { dd:'mm', mm:'yy' }[id]; if (n) document.getElementById(n).focus(); }
function checkBirth(){
  const v = id => parseInt(document.getElementById(id).value, 10);
  const now = new Date(TODAY), d = v('dd'), m = v('mm');
  let y = v('yy');
  if (document.getElementById('yy').value.length === 2) y += (y > now.getUTCFullYear() % 100 ? 1900 : 2000);   // «85» → 1985
  const dt = new Date(Date.UTC(y, m-1, d));
  const ok = y >= 1920 && y <= now.getUTCFullYear() - 18 && m >= 1 && m <= 12 && dt.getUTCDate() === d && dt.getUTCMonth() === m-1;
  if (!ok){
    onb.fails++; ev('birthErr');
    const keep = ['dd','mm','yy'].map(id => document.getElementById(id).value);
    onb.msg = t().birthErr + (onb.fails >= 3 ? '<br>' + t().birthErr3(HELP_PHONE) : '');
    render(); ['dd','mm','yy'].forEach((id,i) => document.getElementById(id).value = keep[i]);
    return;
  }
  // Прототип: подходит любая правильная дата. В пилоте — сверка с договором.
  onb.msg = null; ev('birthOk');
  const canWrite = inTelegram && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.allows_write_to_pm;
  if (canWrite){ finishAuth(true); return; }
  setRoot({ name:'notify' });
}
function notifyScreen(){
  return `${header()}<h1>${t().notifyTitle}</h1>
    <div class="card"><p style="margin:0">🔔 ${t().notifyText}</p></div>
    ${bottom(`<button class="main" id="allowBtn" onclick="askWrite()">${t().allow}</button>
              <button class="second" id="laterBtn" onclick="finishAuth(false)">${t().later}</button>`)}`;
}
// Разрешение боту писать первым — для напоминаний и сообщений «акча түштү»
function askWrite(){
  if (tgSupports('6.9') && tg.requestWriteAccess){
    try{ tg.requestWriteAccess(ok => finishAuth(!!ok)); return; }catch(e){}
  }
  finishAuth(true);
}
function finishAuth(write){
  const was = load(AUTH_KEY, null);
  save(AUTH_KEY, { ok:true, write, ts: Date.now() }); ev('authDone', { write });
  if (was && was.ok){ render(); return; }   // включили напоминания позже — остаёмся на том же экране
  routeEntry();
}

// Если от напоминаний отказались — видно, как включить, прямо на главном экране

}

    return `<div class="sch"><span class="nw">${d.slice(8,10)}.${d.slice(5,7)}.${d.slice(0,4)}</span><span class="nw">${money(l.payment)}</span>${st}</div>`;

    <div class="card call"><span class="hint">${t().ask}</span><a href="tel:${l.phone.replace(/\s/g,'')}">${esc(l.phone)}</a></div>

/* ===================== ОПЛАТА ===================== */
function startPay(id){ pay = { loanId:id, amount: calc(loanById(id)).due, editing:false, msg:null, bank:null }; ev('startPay',{loan:id}); go({ name:'pay' }); }
function amountMsg(){
  const c = calc(loanById(pay.loanId));
  if (pay.amount < c.due) return { cls:'warn', text: c.overdue ? t().sumLessLate(money(c.due)) : t().sumLess(money(c.due)) };
  if (pay.amount > c.due) return { cls:'info', text: t().sumMore };
  return null;
}
function payScreen(){
  const l = loanById(pay.loanId), last = getLastBank();
  const banks = [...BANKS].sort((a,b) => (b.id===last) - (a.id===last));
  const amount = pay.editing
    ? `<div class="amount-in"><input id="amt" inputmode="numeric" autocomplete="off" value="${pay.amount}" aria-label="${t().howMuch}"
         onkeydown="if(event.key==='Enter')saveAmount()"><button onclick="saveAmount()">OK</button></div>`
    : `<div class="amount-row"><div class="big">${money(pay.amount)}</div><button class="lnk" onclick="editAmount()">${t().otherSum}</button></div>`;
  const msg = pay.msg || (!pay.editing && amountMsg());
  const bankRows = banks.map(b => `
    <button class="row bank ${b.id===last?'last':''}" data-bank="${b.id}" ${pay.editing?'disabled':''} onclick="chooseBank('${b.id}')">
      <div class="mid"><b>${b.name}</b>${b.id===last ? `<span class="hint">${t().lastUsed}</span>` : ''}</div><div class="chev" aria-hidden="true">›</div></button>`).join('');
  return `${header()}
    <h1>${t().payTitle}</h1><p class="sub">${esc(l.mfo)}</p>
    <div class="card"><div class="hint">${t().howMuch}</div>${amount}
      ${msg ? `<div class="note ${msg.cls}" role="status">${msg.text}</div>` : ''}</div>
    <div class="sec">${t().whichBank}</div>
    <div class="stack">${bankRows}
      <button class="row bank other" data-bank="qr" ${pay.editing?'disabled':''} onclick="chooseQr()"><div class="mid"><b>${t().otherBank}</b><span class="hint">${t().otherBankHint}</span></div><div class="chev" aria-hidden="true">›</div></button>
    </div>`;
}
function editAmount(){ pay.editing = true; pay.msg = null; render(); setTimeout(()=>{ const i=document.getElementById('amt'); if(i){ i.focus(); i.select(); } },50); }
function saveAmount(){
  const c = calc(loanById(pay.loanId));
  const v = parseInt(String(document.getElementById('amt').value).replace(/\D/g,''), 10);
  if (!v){ pay.msg = { cls:'err', text:t().sumEmpty }; render(); return; }
  if (v > c.totalLeft){ pay.msg = { cls:'err', text:t().sumMax(money(c.totalLeft)) }; render(); return; }
  pay.amount = v; pay.editing = false; pay.msg = null; ev('amount',{amount:v}); render();
}

/* Выбрал банк — сразу ждём денег. Никаких «я оплатил»: о поступлении узнаём сами. */
function chooseBank(id){
  const b = BANKS.find(x => x.id === id), l = loanById(pay.loanId);
  pay.bank = b; save('lastBank', id); ev('bank',{bank:id});
  const link = BANK_LINKS[id];
  if (link){
    const url = link.replace('{amount}', pay.amount).replace('{contract}', encodeURIComponent(l.contract));
    try{ inTelegram ? tg.openLink(url) : window.open(url, '_blank'); }catch(e){}
  }
  startWaiting('bank', !!link);
}
function chooseQr(){ pay.bank = null; ev('qr'); startWaiting('qr', false); }
function startWaiting(mode, linked){
  save(PENDING_KEY, { loanId: pay.loanId, amount: pay.amount, bank: pay.bank ? pay.bank.name : null, mode, ts: Date.now() });
  if (view.name === 'wait'){ view = { name:'wait', mode, linked }; render(); }   // «банк не открылся» → QR, ожидание то же
  else go({ name:'wait', mode, linked });
  waitForMoney(CONFIRM_MS, SLOW_MS);
}
function waitForMoney(confirmIn, slowIn){
  clearTimeout(confirmTimer); clearTimeout(slowTimer);
  confirmTimer = setTimeout(() => confirmPayment('demo'), Math.max(0, confirmIn));
  slowTimer = setTimeout(() => { if (view.name === 'wait'){ view.slow = true; render(); } }, Math.max(0, slowIn));
}
// Человек вернулся в Telegram из приложения банка — проверяем поступление (в пилоте: запрос на сервер ДКБ)
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ hiddenAt = Date.now(); return; }
  if (view.name === 'wait' && hiddenAt && Date.now() - hiddenAt > 1500){ ev('returned'); confirmPayment('demo'); }
});
function cancelPending(toPay){
  clearTimeout(confirmTimer); clearTimeout(slowTimer); save(PENDING_KEY, null); ev('cancelPending');
  if (toPay === false) return;
  const id = pay.loanId;
  stack = active().length > 1 ? [{ name:'home' }, { name:'loan', id }] : [{ name:'loan', id }];
  pay = { loanId:id, amount: calc(loanById(id)).due, editing:false, msg:null, bank:null };
  view = { name:'pay' }; navAt = Date.now(); render();
}

      <div class="card"><ol class="how">${t().qrSteps.map(x=>`<li>${x}</li>`).join('')}</ol>${status}${slow}</div>

                       : `<button class="second" id="notOpened" onclick="chooseQr()">${t().notOpened(b)}</button>`)}`;
}

/* Единственное место, где оплата считается состоявшейся. В пилоте — по сигналу сервера ДКБ. */
function confirmPayment(source){
  if (view.name !== 'wait' || !pay) return;
  const l = loanById(pay.loanId), before = calc(l);
  clearTimeout(confirmTimer); clearTimeout(slowTimer); save(PENDING_KEY, null);
  save(PAY_KEY, load(PAY_KEY, []).concat([{ loanId: l.id, amount: pay.amount }]));
  applyPayment(l, pay.amount);
  const after = calc(l);
  lastPayment = { loanId:l.id, amount:pay.amount, bank: pay.bank ? pay.bank.name : 'QR', source,
                  partial: pay.amount < before.due, wasOverdue: before.overdue > 0, after };
  ev('confirmed', { amount: pay.amount, source });
  haptic('success');
  setRoot({ name:'done' });
}
function doneScreen(){
  const p = lastPayment, l = loanById(p.loanId), c = p.after;
  let next;
  if (c.closed) next = `<div class="kv"><span class="pill green">${t().closed}</span></div>`;
  else if (p.partial) next = `<div class="note warn">${p.wasOverdue ? t().stillDue(money(c.due)) : t().stillDueSoft(money(c.due))}</div>`;
  else next = `<div class="kv"><span>${t().then}</span><b><span class="nw">${date(c.dueDate)}</span> · <span class="nw">${money(c.due)}</span></b></div>`;
  return `<div class="top"></div><div class="tick" aria-hidden="true">✓</div>
    <h1 class="center">${t().done}</h1><p class="sub center">${esc(l.mfo)}</p>
    <div class="card center"><div class="big">${money(p.amount)}</div></div>
    <div class="card">${next}</div>
    ${p.source === 'demo' ? `<div class="demo">${t().demoConfirmed}</div>` : ''}
    ${bottom(`<button class="main" id="readyBtn" onclick="finish()">${t().ready}</button>`)}`;
}
function finish(){ ev('finish'); if (inTelegram){ try{ tg.close(); return; }catch(e){} } setRoot({ name:'home' }); }
function closeApp(){ try{ if (inTelegram){ tg.close(); return; } }catch(e){} toast(t().demo); }
function toggleLang(){ document.querySelectorAll('.toast').forEach(e => e.remove()); lang = lang === 'ky' ? 'ru' : 'ky'; save('langPref', { lang, ts: Math.floor(Date.now()/1000) }); document.documentElement.lang = lang; ev('lang',{lang}); render(); }

/* ===================== ОТРИСОВКА ===================== */
function render(){
  const screens = { welcome:welcomeScreen, notfound:notFoundScreen, birth:birthScreen, notify:notifyScreen,
                    home:homeScreen, loan:loanScreen, pay:payScreen, wait:waitScreen, done:doneScreen };
  document.getElementById('app').innerHTML = (screens[view.name] || homeScreen)();
  document.title = t().title;
  document.body.dataset.view = view.name;
  if (tg){ try{ (!isRoot() && view.name !== 'done') ? tg.BackButton.show() : tg.BackButton.hide(); }catch(e){} }
  if (view.name === 'wait' && view.mode === 'qr') drawQr();
}
// Образец QR (не настоящий платёжный код)
function drawQr(){
  const cv = document.getElementById('qr'); if (!cv) return;
  const x = cv.getContext('2d'), n = 33; let s = 20261002;
  const r = () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648;
  x.fillStyle = '#fff'; x.fillRect(0,0,n,n); x.fillStyle = '#0f1a22';
  const inF = (i,j) => (i<8&&j<8)||(i>n-9&&j<8)||(i<8&&j>n-9);
  for (let i=0;i<n;i++) for (let j=0;j<n;j++){ if (!inF(i,j) && r() < .48) x.fillRect(i,j,1,1); }
  [[0,0],[n-7,0],[0,n-7]].forEach(([px,py]) => { for (let i=0;i<7;i++) for (let j=0;j<7;j++){
    const on = i===0||i===6||j===0||j===6||(i>1&&i<5&&j>1&&j<5); x.fillStyle = on ? '#0f1a22' : '#fff'; x.fillRect(px+i,py+j,1,1); } });
}

/* Куда вести после входа: из напоминания бот открывает сразу оплату (?screen=pay&loan=TM) */
function routeEntry(){
  const l = entry && loanById(entry.loan);
  if (entry && entry.screen === 'pay' && l && !calc(l).closed){
    stack = active().length > 1 ? [{ name:'home' }, { name:'loan', id:l.id }] : [{ name:'loan', id:l.id }];
    pay = { loanId:l.id, amount: calc(l).due, editing:false, msg:null, bank:null };
    view = { name:'pay' };
  } else if (l){ stack = active().length > 1 ? [{ name:'home' }] : []; view = { name:'loan', id:l.id }; }
  else { stack = []; view = { name:'home' }; }
  navAt = Date.now(); render(); window.scrollTo(0,0);
}
(function start(){
  entry = { screen: params.get('screen'), loan: params.get('loan') };
  load(PAY_KEY, []).forEach(x => { const ln = loanById(x.loanId); if (ln) applyPayment(ln, x.amount); });
  if (!load(AUTH_KEY, null) && params.get('auth') !== 'skip'){ view = { name:'welcome' }; render(); }
  else {
    const pend = load(PENDING_KEY, null);
    if (pend && loanById(pend.loanId)){
      // Закрыл приложение во время ожидания и открыл снова — продолжаем ждать, а не предлагаем платить ещё раз
      const id = pend.loanId;
      pay = { loanId:id, amount: pend.amount, editing:false, msg:null, bank: pend.bank ? { name: pend.bank } : null };
      stack = active().length > 1 ? [{ name:'home' }, { name:'loan', id }, { name:'pay' }] : [{ name:'loan', id }, { name:'pay' }];
      view = { name:'wait', mode: pend.mode || 'bank', linked:false }; render();
      const passed = Date.now() - pend.ts;
      waitForMoney(CONFIRM_MS - passed, SLOW_MS - passed);
    } else routeEntry();
  }
  if (window.__tgLoaded || window.Telegram) tgInit();
})();
</script>
